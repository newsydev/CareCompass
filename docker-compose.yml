# Demo stack: open http://localhost:8080 or http://localhost:5173 (nginx serves the UI and proxies /api to the backend).
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: carecompass_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - CARECOMPASS_DB_PATH=/var/lib/carecompass/carecompass.sqlite3
      - CARECOMPASS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173,http://192.168.161.179:8080,http://192.168.161.179:5173
    env_file:
      - path: backend/.env
        required: false
    volumes:
      - carecompass-data:/var/lib/carecompass
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carecompass_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  carecompass-data:
