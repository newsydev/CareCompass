# Demo stack: open http://localhost:8080 (nginx serves the UI and proxies /api to the backend).
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: carecompass_backend
    restart: unless-stopped
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - CARECOMPASS_DB_PATH=/var/lib/carecompass/carecompass.sqlite3
      - CARECOMPASS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080
    env_file:
      - path: backend/.env
        required: false
    volumes:
      - carecompass-data:/var/lib/carecompass
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carecompass_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  carecompass-data:
