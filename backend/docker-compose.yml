services:
  carecompass-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carecompass_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - GROQ_API_KEY=${GROQ_API_KEY}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
